# What the operator can change without a release.
#
# Most of this file used to be lists of who writes to us - customer domains,
# supplier domains, portals, our own template phrases. Measured on the corpus,
# removing every one of them changed nothing: accuracy stayed at 0.923 with the
# same single miss. The model reads the text; it does not need a directory.
#
# The `Registries` model still carries those fields, so putting a list back is
# an edit here and nothing in the code.
#
# "Who we are" is no longer written down either - it comes from MAILBOX_ADDRESS,
# because the mailbox we watch is ours by definition.

# Outlook labels stamped on a classified email, so the mailbox itself shows what
# the agent decided. Names must match categories that already exist in the
# mailbox, otherwise the label appears without colour.
#
# One label per email - it answers "what happened to this?", and two answers to
# one question is not a decision. The single exception is `not_sent`, which
# pairs with the RFQ label: "this is an RFQ" and "nobody sent it" are two
# different facts and the operator needs both.
#
# Every action maps to something on purpose: "no label" is what tells an
# operator the email never reached the agent at all.
# These names must match the categories that already exist in the mailbox,
# otherwise the label appears without a colour.
outlook_categories:
  by_action:
    FORWARD_TO_DST: SSG RFQ
    # No dedicated label for these three yet, and they do need a person to route
    # them, so they share the review label. Split them out once the mailbox has
    # an "SSG Routed" category.
    ROUTE_TO_CS: SSG Review
    ROUTE_TO_SOURCING: SSG Review
    ROUTE_TO_ORDER_TEAM: SSG Review
    HUMAN_REVIEW: SSG Review
    IGNORE: SSG No action
  needs_review: SSG Review
  # An RFQ the agent could not route or could not send. Sits beside SSG RFQ.
  not_sent: SSG Not Sent
  error: SSG Error

# The two rules that still decide without the model, and how sure they are.
fast_path:
  min_body_chars: 10
  confidence:
    internal_only: 0.97
    empty_body: 0.95

# How to recognise which regional desk an RFQ belongs to.
#
# The recipient addresses are NOT here - they are real mailboxes and this file is
# committed. Each key below is paired with an address from the environment
# (`uae` -> UAE_MAILBOX, `sg` -> SG_MAILBOX) by `Settings.region_mailboxes`. A
# region with no address configured is never forwarded to; it is labelled for a
# person instead.
#
# Resolution order, most to least trustworthy: an explicit region_hint from the
# caller, the regex-extracted delivery port, whole-word keywords in the subject
# and newest message, then the watched mailbox as a default. Two regions matching
# at once counts as no match, because a misrouted RFQ is lost silently.
#
# `ports` are matched as substrings of the extracted value, which reads
# "Fujairah" or "UAE - Dubai" in this corpus. `keywords` are matched as whole
# words, so "sg" cannot fire inside "message".
regions:
  # `ports` are matched as substrings, so only the shortest distinctive form is
  # listed: "jebel ali" already catches "Port of Jebel Ali".
  uae:
    # Exactly as the workbook's branch dropdown spells it: the port list the
    # RFQ is validated against hangs off this value.
    template_branch: UAE-DUBAI
    ports:
      - fujairah
      - jebel ali
      - khor fakkan
      - dubai
      - port rashid
      - mina rashid
      - al hamriya
      - sharjah
      - port khalid
      - abu dhabi
      - khalifa port
      - mina zayed
      - ajman
    keywords:
      - dubai
      - uae
      - u.a.e.
      - united arab emirates
      - fujairah
      - sharjah
      - abu dhabi
      - ajman
      - jebel ali
      - khor fakkan
      - khalifa port
      - mina zayed
    mailbox_markers:
      - uae
      - dubai

  sg:
    template_branch: SINGAPORE
    ports:
      - singapore
      - tuas
      - tanjong pagar
      - keppel
      - brani
      - pasir panjang
      - sembawang
      - jurong
    # keppel, jurong, sembawang and brani are terminals but also Singapore
    # company names, so they stay out of the keywords: a supplier's letterhead
    # must not route a Dubai delivery. As ports they are unambiguous.
    keywords:
      - singapore
      - sg
      - sgp
      - tuas
      - tanjong pagar
      - pasir panjang
    mailbox_markers:
      - sg
      - sgp
      - singapore
