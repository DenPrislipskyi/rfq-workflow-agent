services:
  db:
    image: postgres:17-alpine
    container_name: rfq-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rfq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfq_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rfq}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - rfq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  rfq_postgres_data:
