[project]
name = "rfq-workflow-agent"
version = "0.1.0"
description = "Mailbox triage agent for a marine ship chandler: classifies incoming email and spots customer RFQs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "extract-msg>=0.56.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "msal>=1.37.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "py7zr>=1.1.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.17.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.11",
    "uvicorn[standard]>=0.52.4",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# auto: async tests need no decorator, which keeps the test files plain.
asyncio_mode = "auto"
